# gitleaks config: the built-in secret rules plus phone-number rules
# (CLAUDE.md golden rule 5: no phone number anywhere in the repository).
# Test vectors: scripts/gitleaks-rules.test.mjs. Go regexp (RE2): no lookarounds,
# so boundaries are explicit. Separators include the no-break space and en / em
# dashes that Word and web pages substitute for spaces and hyphens.
title = "ivanvasiunin.com"

[extend]
useDefault = true

[[rules]]
id = "phone-international"
description = "Phone number with + / 00 / %2B country prefix (golden rule 5)"
# The prefix must not follow a base64 / URL character, so "a+1234567/" in an
# integrity hash or data URI is not a phone number.
regex = '''(?:^|[^A-Za-z0-9+/=%])(?:\+|%2[Bb]|00)[ \x{00A0}.\-\x{2013}\x{2014}]?\d{1,3}[ \x{00A0}.\-\x{2013}\x{2014}]?\(?\d{2,4}\)?(?:[ \x{00A0}.\-\x{2013}\x{2014}]?\d{2,4}){2,3}\b'''
tags = ["pii"]

  [[rules.allowlists]]
  description = "Lockfile integrity hashes (base64 may contain '+' and digits)"
  regexTarget = "line"
  regexes = ['''sha(?:1|256|384|512)-[A-Za-z0-9+/=]{20,}''']

[[rules]]
id = "phone-ru-national"
description = "Russian number without '+': 7 / 8 + 10 digits, e.g. 8 (NNN) NNN-NN-NN (golden rule 5)"
regex = '''\b[78][ \x{00A0}.\-\x{2013}\x{2014}]?\(?\d{3}\)?[ \x{00A0}.\-\x{2013}\x{2014}]?\d{3}[ \x{00A0}.\-\x{2013}\x{2014}]?\d{2}[ \x{00A0}.\-\x{2013}\x{2014}]?\d{2}\b'''
tags = ["pii"]

  [[rules.allowlists]]
  description = "Lockfile integrity hashes"
  regexTarget = "line"
  regexes = ['''sha(?:1|256|384|512)-[A-Za-z0-9+/=]{20,}''']

[[rules]]
id = "phone-local"
description = "Number without a country code: (area) NNN-NN-NN, or a 10-digit mobile 9NN NNN NN NN (golden rule 5)"
regex = '''(?:\(\d{3,5}\)[ \x{00A0}.\-\x{2013}\x{2014}]?\d{2,4}[ \x{00A0}.\-\x{2013}\x{2014}]\d{2}[ \x{00A0}.\-\x{2013}\x{2014}]\d{2}\b)|(?:\b9\d{2}[ \x{00A0}.\-\x{2013}\x{2014}]?\d{3}[ \x{00A0}.\-\x{2013}\x{2014}]?\d{2}[ \x{00A0}.\-\x{2013}\x{2014}]?\d{2}\b)'''
tags = ["pii"]

  [[rules.allowlists]]
  description = "Lockfile integrity hashes"
  regexTarget = "line"
  regexes = ['''sha(?:1|256|384|512)-[A-Za-z0-9+/=]{20,}''']
