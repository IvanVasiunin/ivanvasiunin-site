<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The site's mark (SiteHeader): a chart reticle with a golden planet, in the dark theme's colours
       (tokens.scss) on the dark sky, so it reads on light and dark browser tabs alike. -->
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="5" y1="59" x2="59" y2="5">
      <stop offset="0" stop-color="#6ed3c8"/>
      <stop offset="0.5" stop-color="#8db2ff"/>
      <stop offset="1" stop-color="#bba6ff"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.5" stop-color="#f6cf6a"/>
      <stop offset="1" stop-color="#c98a1c"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e1430"/>
  <g fill="none" stroke="url(#line)" stroke-linecap="round" transform="translate(32 32) scale(0.86) translate(-32 -32)">
    <circle cx="32" cy="32" r="24" stroke-width="4"/>
    <circle cx="32" cy="32" r="13.3" stroke-width="2.8" opacity="0.8"/>
    <path d="M32 2.7v6.9M32 54.4v6.9M2.7 32h6.9M54.4 32h6.9" stroke-width="4"/>
  </g>
  <circle cx="40.1" cy="23.9" r="5.6" fill="url(#gold)"/>
</svg>
