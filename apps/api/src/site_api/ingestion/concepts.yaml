# The knowledge map's concepts (ROADMAP 6.2, SPEC §4.4, ADR-0012): the names a guest recognises.
# A chunk "mentions" a concept when one of its aliases occurs in the text as a whole word, any case.
# The map's "Topics" line lists the concepts an answer names that the read chunks also mention.
#
# - id: stable, used in points.json;
# - label: what the page shows;
# - aliases: lowercase spellings to match (English first; RU / UK stems where a guest may ask so);
# - not_in: source types where the word means something else (site docs speak of "mentor mode",
#   a way of working in this repository, not of mentoring people).
#
# Every skill, company and project of the CV must have a concept here (a test checks it).

