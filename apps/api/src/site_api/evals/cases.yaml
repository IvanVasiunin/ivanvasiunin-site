# Elio's eval cases (ROADMAP 4.5, SPEC §5, ADR-0004 layer 6). Six types, in EN / ES / RU / UK.
#
# Each case asks one question through the real graph (real models, real retrieval) and checks:
#   route          the router's class (router accuracy per class);
#   finish         the done event's finish_reason: stop | templated | no_info (any of a list);
#   sources        true: the answer has sources; false: it has none;
#   contains_any   the answer contains at least one of these (case-insensitive);
#   contains_all   the answer contains every one of these (case-insensitive);
#   contains_none  the answer contains none of these (case-insensitive);
#   history        earlier turns sent with the question (a continued conversation);
#   judged         in-scope answers also get the judge's faithfulness and relevancy scores.
# A check left out is not checked. Expected facts come from the knowledge base (data/, the CV).

cases:
  # ── in_scope: grounded answers about Ivan's work ─────────────────────────────────────────────
  - id: in-scope-brainrocket-en
    type: in_scope
    language: en
    question: What does Ivan do at BrainRocket?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [BrainRocket]
    judged: true
  - id: in-scope-stack-en
    type: in_scope
    language: en
    question: Which technologies does Ivan use?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [SCSS, TypeScript, React, JavaScript]
    judged: true
  - id: in-scope-numbersvalidator-en
    type: in_scope
    language: en
    question: What is NumbersValidator?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [phone, validation, validates, validator]
    judged: true
  - id: in-scope-rag-en
    type: in_scope
    language: en
    question: How is this site's RAG built?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [retrieval, embedding, vector, RRF, Postgres]
    judged: true
  - id: in-scope-liketelecom-en
    type: in_scope
    language: en
    question: How long did Ivan work at Liketelecom?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: ['2016', '2024']
    judged: true
  - id: in-scope-roles-en
    type: in_scope
    language: en
    question: Is Ivan open to job offers, and which roles is he looking for?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [Frontend, AI Engineer, AI]
    judged: true
  - id: in-scope-stack-es
    type: in_scope
    language: es
    question: ¿Qué tecnologías usa Iván?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [SCSS, TypeScript, React, JavaScript]
    judged: true
  - id: in-scope-brainrocket-ru
    type: in_scope
    language: ru
    question: Чем Иван занимается в BrainRocket?
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [BrainRocket]
    judged: true
  - id: in-scope-education-uk
    type: in_scope
    language: uk
    question: Яка освіта в Івана?
    route: about_ivan
    finish: [stop]
    sources: true
    judged: true

  # data/github-projects.md (2026-11-07): what his code shows, beyond the READMEs.
  - id: in-scope-smart-test-task-en
