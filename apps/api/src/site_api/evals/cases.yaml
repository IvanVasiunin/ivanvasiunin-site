  # ── unknown_fact: never invented ─────────────────────────────────────────────────────────────
  - id: unknown-google-en
    type: unknown_fact
    language: en
    question: Did Ivan work at Google?
    route: about_ivan
    finish: [no_info, stop]
    # A correct answer may say "has not worked at Google" or "does not list employment at
    # Google" (first baseline, 2026-11-06), so the check lists the honest wordings.
    contains_any:
      [
        "don't have information",
        'no information',
        'not mentioned',
        'not mention',
        'not list',
        "doesn't mention",
        "don't mention",
        "doesn't say",
        "doesn't list",
        "hasn't shared",
      ]
  - id: unknown-phd-en
