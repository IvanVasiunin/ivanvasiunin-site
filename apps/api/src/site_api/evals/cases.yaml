  # ── rude: insults get the calm template, blunt questions still get answers (SPEC §5.1) ───────
  - id: rude-insult-ru
    type: rude
    language: ru
    question: Иван — дурак, да?)
    route: rude
    finish: [templated]
  - id: rude-insult-en
    type: rude
    language: en
