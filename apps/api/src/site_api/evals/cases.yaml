    route: about_ivan
    finish: [stop, no_info]

  # ── Job descriptions (SPEC §5.7, Ivan's live check 2026-11-08) ───────────────────────────────
  - id: job-fit-en
    type: in_scope
    language: en
    question: |-
      Would Ivan be a good fit for this role?

      Requirements:
      - Bachelor's degree in Computer Engineering or a similar field.
      - 5+ years of experience with core frontend technologies.
      - Expertise in at least one modern JavaScript framework.
      - Experience with testing tools like Jest, Playwright or Cypress.
      - Experience collaborating closely with UX designers.
    route: about_ivan
    finish: [stop]
    sources: true
    # One search query per requirement (router v5): each requirement finds its own sources, so the
    # answer covers his degree and his Jest study project instead of "no information".
    contains_all: [React, Jest]
    contains_any: [bachelor, "bachelor's", Donetsk, specialist]
    contains_none: ['out of 10', 'match score']
    judged: true
  # The rest of a vacancy, pasted without a question after Elio asked for it: before router v4 it
  # was classified alone and got the off-topic template.
  - id: job-fit-continuation-en
    type: in_scope
    language: en
    history:
      - role: user
        content: >-
          Как думаешь, он справился бы с такой работой? We are an IT consulting company with
          more than 10 years in the market, working from Lisbon, Porto and Madrid.
      - role: assistant
        content: >-
          The text appears to be cut off before the role and requirements. Please send the
          rest, and I can compare it with Ivan's experience and skills.
    question: |-
      5+ years of experience with core frontend technologies.
      Expertise in at least one modern JavaScript framework.
      Experience applying testing tools like Jest, Jasmine, Mocha, Playwright and Cypress.
      Experience collaborating closely with UX designers.
    route: about_ivan
    finish: [stop]
    sources: true
    contains_any: [React, Angular, JavaScript]
  - id: job-link-only-ru
    type: in_scope
    language: ru
    question: Как думаешь, он справился бы с такой работой? https://www.linkedin.com/jobs/view/1234567890/
    route: about_ivan
    finish: [stop, no_info]
    contains_any: [текст, описание, описания, ссылке, ссылку, ссылки]
  # A whole vacancy with a place and a work format (Ivan's live check, 2026-11-08): one query for the
  # whole text missed his testing experience, his degree and his openness to relocation.
  - id: job-fit-full-vacancy-ru
    type: in_scope
    language: ru
    question: |-
      У нас есть вот такая вакансия, подойдет ли нам Иван?

      We are an IT consulting company with more than 10 years in the market and over 800
      professionals in Lisbon, Porto and Madrid. We would like to meet a Senior Frontend Developer
      to join a project with a hybrid working model based in Braga (on-site 3 days per week).

      Requirements:
      - Bachelor's degree in Computer Engineering, Management Information Systems or a similar field.
      - 5+ years of experience with core frontend technologies.
      - Expertise in at least one modern JavaScript framework.
      - Experience applying testing tools like Jest, Jasmine, Mocha, Playwright and Cypress.
      - Experience collaborating closely with UX designers.
      - Advanced English proficiency.

      Responsibilities:
      - Develop user interfaces with JavaScript, HTML, CSS and Angular or React.
      - Work in agile, cross-functional teams, from concept to deployment.
      - Implement testing strategies with Jest, Jasmine, Mocha or Selenium.
    route: about_ivan
    finish: [stop]
    sources: true
    contains_all: [Jest]
    contains_any: [релокации, релокацию, релокация, переезду, переезда, переехать, переезд]
    judged: true

  # The "not shared" sentence in the visitor's language (Ivan's live check, 2026-11-08: it came in
  # English to a question in Russian).
  - id: personal-not-shared-ru
    type: personal
    language: ru
    question: Так что Иван ел на завтрак?
    route: about_ivan
    finish: [stop, no_info]
    contains_any: [не делился, не рассказывал, нет информации]
    contains_none: ["hasn't shared"]
